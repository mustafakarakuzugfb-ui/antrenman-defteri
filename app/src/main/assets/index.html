<title>Antrenman Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: tek sütun mobil defter — üstte tarih şeridi, altında 10 istasyon kartı (programdaki sırayla), en altta sekme çubuğu */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#0c1630; --muted:#5b6680; --line:#d6dbe6;
  --navy:#0b1f6b; --navy-soft:#e3e8f7; --chalk:#f2b705; --chalk-ink:#3b2c00; --good:#1f8a4c; --danger:#b3261e;
  --display:"Barlow Condensed","sans-serif-condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f1d; --surface:#131a2c; --ink:#e7ebf5; --muted:#8e98b3; --line:#26304a;
  --navy:#8fa6ff; --navy-soft:#1b2546; --chalk:#f5c42c; --chalk-ink:#2a1f00; --good:#4cc47f; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1d; --surface:#131a2c; --ink:#e7ebf5; --muted:#8e98b3; --line:#26304a;
  --navy:#8fa6ff; --navy-soft:#1b2546; --chalk:#f5c42c; --chalk-ink:#2a1f00; --good:#4cc47f; --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 96px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}

header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
header.top h1{font-size:30px;font-weight:800;letter-spacing:.01em;color:var(--navy);line-height:1}
.meta{font-size:13px;color:var(--muted);text-align:right}
.meta b{color:var(--ink);font-weight:600}

.datebar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.datebar button{height:44px;border:0;background:var(--navy-soft);border-radius:10px;font-size:22px;color:var(--navy)}
.datebar button:disabled{opacity:.35}
.dlabel{text-align:center}
.dlabel .d{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1}
.dlabel .s{font-size:12px;color:var(--muted)}

.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--chalk);transition:width .3s}
.progress span{font-size:13px;color:var(--muted);white-space:nowrap}

.list{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex.done{border-color:var(--chalk)}
.exhead{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:12px}
.badge{width:44px;height:44px;border-radius:10px;background:var(--navy);color:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px}
.ex.done .badge{background:var(--chalk);color:var(--chalk-ink)}
.exname{min-width:0}
.exname h3{font-size:20px;font-weight:700;line-height:1.1}
.exname .en{font-size:12px;color:var(--muted)}
.exname .last{font-size:13px;color:var(--muted);margin-top:2px}
.exname .last b{color:var(--ink);font-weight:600}
.target{font-family:var(--display);font-weight:700;font-size:18px;color:var(--navy);text-align:right;line-height:1}
.target small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);margin-top:3px}

.body{border-top:1px dashed var(--line);padding:12px;display:flex;flex-direction:column;gap:12px}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--navy-soft);border-radius:999px;padding:6px 6px 6px 12px;font-weight:600;font-size:15px}
.chip em{font-style:normal;font-size:12px;color:var(--muted);font-weight:500}
.chip button{border:0;background:transparent;width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:16px}
.empty{font-size:14px;color:var(--muted)}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
.stepper{display:grid;grid-template-columns:40px 1fr 40px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;background:transparent;font-size:22px;color:var(--navy);height:48px}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:var(--display);font-weight:700;font-size:24px;color:var(--ink);-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.add{height:50px;border:0;border-radius:12px;background:var(--navy);color:var(--surface);font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.03em}
.hint{font-size:12px;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs div{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:560px}
nav.tabs button{height:46px;border:0;border-radius:10px;background:transparent;font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--navy-soft);color:var(--navy)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:22px;font-weight:700}
.pick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pick button{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.pick button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.chart{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px}
.stat .v{font-family:var(--display);font-weight:700;font-size:22px}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.hrow:first-child{border-top:0}
.hrow button{border:0;background:none;text-align:left;padding:0;min-width:0}
.hrow .t{font-weight:600}
.hrow .s{font-size:13px;color:var(--muted)}
.hrow .r{font-family:var(--display);font-weight:700;font-size:18px;text-align:right}

.howto{display:flex;flex-direction:column;gap:8px}
.howto canvas{width:100%;aspect-ratio:4/3;max-width:100%;display:block;background:var(--bg);border-radius:12px;cursor:pointer}
.howto ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.howto .cap{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.linkbtn{border:0;background:none;padding:0;color:var(--navy);font-weight:600;font-size:13px}
.backup{display:flex;flex-direction:column;gap:8px}
.backup p{margin:0;font-size:14px;color:var(--muted)}
.backup textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:12px/1.4 ui-monospace,monospace;padding:8px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.ghost{height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600}
.status{font-size:12px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <h1>Antrenman<br>Defteri</h1>
    <div class="meta">Hedef: <b>yağ kaybı</b><br>3 gün/hafta · 50–60 dk<br>Program sonu: <b class="num" id="left"></b></div>
  </header>

  <section id="view-log" class="list" aria-label="Bugünkü antrenman">
    <div class="datebar">
      <button id="prev" aria-label="Önceki gün">‹</button>
      <div class="dlabel"><div class="d" id="dlabel"></div><div class="s" id="dsub"></div></div>
      <button id="next" aria-label="Sonraki gün">›</button>
    </div>
    <div class="progress"><div class="bar"><i id="pbar" style="width:0"></i></div><span class="num" id="ptext"></span></div>
    <div class="list" id="exlist"></div>
  </section>

  <section id="view-hist" class="list" hidden aria-label="Gelişim">
    <div class="card">
      <h2>Gelişim</h2>
      <div class="pick" id="pick"></div>
      <div id="chartbox"></div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="card">
      <h2>Geçmiş antrenmanlar</h2>
      <div class="hist" id="hist"></div>
    </div>
    <div class="card backup">
      <h2>Yedek</h2>
      <p id="bkinfo">Kayıtlarını bir metin olarak dışa aktarıp saklayabilir, başka cihazda geri yükleyebilirsin.</p>
      <div class="btnrow"><button class="ghost" id="bk-export">Yedeği dışa aktar</button></div>
      <label for="bk-text" class="hint">Geri yüklemek için yedek metnini buraya yapıştır:</label>
      <textarea id="bk-text" placeholder='{"app":"antrenman-defteri", …}'></textarea>
      <div class="btnrow"><button class="ghost" id="bk-import">Yedeği geri yükle</button></div>
    </div>
  </section>

  <p class="status" id="status">Kayıtlar yükleniyor…</p>
</div>

<nav class="tabs"><div role="tablist">
  <button role="tab" id="tab-log" aria-selected="true">Antrenman</button>
  <button role="tab" id="tab-hist" aria-selected="false">Gelişim</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>
/* Antrenman Defteri — alet animasyonları (yan görünüm, sağa bakan figür) */
const ANIM=(()=>{
const D=Math.PI/180, W=320, H=240, FLOOR=200, OFF=32;
const L={torso:66,uarm:34,farm:32,thigh:46,shin:44,neck:5,head:11};
const at=(p,a,l)=>[p[0]+Math.cos(a*D)*l,p[1]+Math.sin(a*D)*l];
const add=(p,x,y)=>[p[0]+x,p[1]+y];
const lerp=(a,b,t)=>a+(b-a)*t;
const lerpP=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
const ang=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0])/D;
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;

/* İki parçalı uzuv: kök noktadan hedefe uzan, eklemi sign yönüne bük */
function ik(root,target,l1,l2,sign){
  const dx=target[0]-root[0],dy=target[1]-root[1];
  let d=Math.hypot(dx,dy);d=Math.min(Math.max(d,Math.abs(l1-l2)+.5),l1+l2-.5);
  const base=Math.atan2(dy,dx);
  const a=Math.acos((l1*l1+d*d-l2*l2)/(2*l1*d));
  const j=[root[0]+Math.cos(base+sign*a)*l1,root[1]+Math.sin(base+sign*a)*l1];
  const e=at(j,ang(j,target),l2);
  return[j,e];
}
function trunk(Hp,ta){const S=at(Hp,ta,L.torso);return{H:Hp,S,Hd:at(S,ta,L.neck+L.head),ta}}
function legFK(Hp,th,sh){const K=at(Hp,th,L.thigh);return{K,A:at(K,sh,L.shin)}}
function legIK(Hp,A,sign=-1){const[K,A2]=ik(Hp,A,L.thigh,L.shin,sign);return{K,A:A2}}
function armIK(S,Wt,sign=1){const[E,W2]=ik(S,Wt,L.uarm,L.farm,sign);return{E,W:W2}}
function armFK(S,ua,fa){const E=at(S,ua,L.uarm);return{E,W:at(E,fa,L.farm)}}

/* Kuvvet hareketi zamanlaması: 1.5 sn kaldır, 0.4 sn sık, 2 sn indir, 0.4 sn dinlen */
const CYC=4.3;
function strength(sec){
  const x=sec%CYC;
  if(x<1.5)return{p:ease(x/1.5),ph:0};
  if(x<1.9)return{p:1,ph:1};
  if(x<3.9)return{p:1-ease((x-1.9)/2),ph:2};
  return{p:0,ph:3};
}

/* ---- çizim yardımcıları ---- */
let C={};
function readColors(){
  const cs=getComputedStyle(document.documentElement);
  const g=n=>cs.getPropertyValue(n).trim();
  C={fig:g("--navy"),ink:g("--ink"),m:g("--muted"),line:g("--line"),acc:g("--chalk"),pad:g("--navy-soft"),bg:g("--bg"),surf:g("--surface"),font:g("--body")||"sans-serif"};
}
function seg(ctx,a,b,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
function poly(ctx,pts,w,col){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
function dot(ctx,p,r,fill,stroke){ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function box(ctx,x,y,w,h,fill,stroke,r=3){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function padSeg(ctx,a,b,w){seg(ctx,a,b,w+3,C.m);seg(ctx,a,b,w,C.pad)}
function floor(ctx){seg(ctx,[8,FLOOR],[W-8,FLOOR],2,C.line)}

/* ağırlık yığını: x solda, p kaldırılan miktar (0..1) */
function stack(ctx,x,p,top=40){
  seg(ctx,[x,top],[x,FLOOR],3,C.m);seg(ctx,[x+34,top],[x+34,FLOOR],3,C.m);seg(ctx,[x-4,top],[x+38,top],3,C.m);
  for(let i=0;i<4;i++)box(ctx,x+4,FLOOR-8-i*9,26,7,C.pad,C.m,2);
  const lift=p*26;
  for(let i=0;i<2;i++)box(ctx,x+4,FLOOR-44-i*9-lift,26,7,C.acc,C.m,2);
  seg(ctx,[x+17,FLOOR-46-9-lift],[x+17,top+8],2,C.m);
  dot(ctx,[x+17,top+6],4,C.surf,C.m);
}
function seatPost(ctx,Hp,ta,{back=true,len=56,seatL=-24,seatR=34}={}){
  box(ctx,Hp[0]+seatL,Hp[1]+6,seatR-seatL,9,C.pad,C.m,4);
  seg(ctx,[Hp[0]+4,Hp[1]+15],[Hp[0]+4,FLOOR],4,C.m);
  seg(ctx,[Hp[0]-22,FLOOR],[Hp[0]+30,FLOOR],5,C.m);
  if(back){const o=at([0,0],ta-90,11);padSeg(ctx,add(at(Hp,ta,4),o[0],o[1]),add(at(Hp,ta,len),o[0],o[1]),8)}
}

/* ---- figür ---- */
function figure(ctx,f){
  const far=f.far||{};
  ctx.globalAlpha=.32;
  if(far.leg)drawLeg(ctx,f.H,far.leg);
  if(far.arm)drawArm(ctx,f.S,far.arm);
  ctx.globalAlpha=1;
  seg(ctx,f.H,f.S,15,C.fig);
  dot(ctx,f.Hd,L.head,C.fig);
  drawLeg(ctx,f.H,f.leg);
  drawArm(ctx,f.S,f.arm);
}
function drawLeg(ctx,Hp,l){
  const toe=at(l.A,ang(l.K,l.A)-90+(l.toeAdj||0),13);
  seg(ctx,Hp,l.K,11,C.fig);seg(ctx,l.K,l.A,9,C.fig);seg(ctx,l.A,toe,6,C.fig);
}
function drawArm(ctx,S,a){seg(ctx,S,a.E,8,C.fig);seg(ctx,a.E,a.W,7,C.fig);dot(ctx,a.W,4.5,C.fig)}

/* ---- egzersizler ---- */
const EXS={
 1:{cardio:true,label:()=>"Sabit tempo · nefes düzenli",
   draw(ctx,sec){
     const th=sec/2.1*360, c=[132,184];
     const Hp=[118,104], b=trunk(Hp,-86);
     const foot=t=>[c[0]+28*Math.cos(t*D),c[1]+7*Math.sin(t*D)];
     const hand=t=>[b.S[0]+30-13*Math.cos(t*D),b.S[1]+30];
     // makine
     seg(ctx,[58,FLOOR-4],[236,FLOOR-4],6,C.m);seg(ctx,[226,FLOOR-4],[214,72],6,C.m);box(ctx,200,58,30,16,C.pad,C.m,4);
     const pole=(t,alpha)=>{ctx.globalAlpha=alpha;const h=hand(t),pv=[c[0]+70,FLOOR-30];seg(ctx,h,pv,5,C.m);dot(ctx,pv,4,C.surf,C.m);const ft=foot(t);box(ctx,ft[0]-12,ft[1]+2,30,5,C.acc,C.m,2);seg(ctx,[ft[0]+10,ft[1]+5],pv,3,C.m);ctx.globalAlpha=1};
     pole(th+180,.32);
     const legN=legIK(Hp,foot(th)),legF=legIK(Hp,foot(th+180));
     const armN=armIK(b.S,hand(th)),armF=armIK(b.S,hand(th+180));
     dot(ctx,[c[0]+8,c[1]-2],13,null,C.m);
     figure(ctx,{...b,leg:legN,arm:armN,far:{leg:legF,arm:armF}});
     pole(th,1);dot(ctx,armN.W,4.5,C.fig);
     return 0;
   }},
 2:{label:ph=>["Bacağı uzat · nefes ver","Üstte 1 sn sık","Yavaşça indir · nefes al","Kontrollü başla"][ph],
   draw(ctx,sec){
     const {p,ph}=strength(sec);const Hp=[122,128],b=trunk(Hp,-104);
     stack(ctx,22,p);
     const leg=legFK(Hp,0,lerp(86,6,p));const arm=armIK(b.S,[Hp[0]+10,Hp[1]+12]);
     seatPost(ctx,Hp,b.ta,{seatR:40});
     const sh=ang(leg.K,leg.A),padC=add(at(leg.K,sh,37),...at([0,0],sh-90,10));
     seg(ctx,leg.K,padC,5,C.m);seg(ctx,[39,48],[60,48],2,C.m);seg(ctx,[60,48],leg.K,2,C.m);
     figure(ctx,{...b,leg,arm});
     dot(ctx,padC,8,C.acc,C.m);dot(ctx,leg.K,5,C.surf,C.acc);dot(ctx,arm.W,4.5,C.acc);
     return ph;
   }},
 3:{label:ph=>["Topukları alta çek · nefes ver","Altta 1 sn sık","Yavaşça bırak · nefes al","Kontrollü başla"][ph],
   draw(ctx,sec){
     const {p,ph}=strength(sec);const Hp=[122,128],b=trunk(Hp,-104);
     stack(ctx,22,p);
     const leg=legFK(Hp,0,lerp(14,100,p));const arm=armIK(b.S,[Hp[0]+10,Hp[1]+12]);
     seatPost(ctx,Hp,b.ta,{seatR:40});
     const sh=ang(leg.K,leg.A),padC=add(at(leg.K,sh,37),...at([0,0],sh+90,10));
     seg(ctx,leg.K,padC,5,C.m);seg(ctx,[39,48],[60,48],2,C.m);seg(ctx,[60,48],leg.K,2,C.m);
     figure(ctx,{...b,leg,arm});
     padSeg(ctx,[Hp[0]+16,Hp[1]-14],[leg.K[0]-6,Hp[1]-14],8);seg(ctx,[leg.K[0]-6,Hp[1]-14],[leg.K[0]+8,Hp[1]-40],3,C.m);
     dot(ctx,padC,8,C.acc,C.m);dot(ctx,leg.K,5,C.surf,C.acc);dot(ctx,arm.W,4.5,C.acc);
     return ph;
   }},
 4:{label:ph=>["Barı göğse çek · nefes ver","Kürekleri sık","Yavaşça yukarı bırak · nefes al","Kollar uzun, omuz gergin"][ph],
   draw(ctx,sec){
     const {p,ph}=strength(sec);const Hp=[130,150],b=trunk(Hp,lerp(-96,-106,p));
     stack(ctx,22,p,10);
     const leg=legFK(Hp,-4,92);
     const Wt=lerpP([b.S[0]+12,b.S[1]-64],[b.S[0]+18,b.S[1]+8],p);
     const arm=armIK(b.S,Wt,1);
     seatPost(ctx,Hp,b.ta,{back:false,seatL:-22,seatR:22});
     const pul=[b.S[0]+14,14];
     seg(ctx,[39,10],[pul[0],10],3,C.m);dot(ctx,pul,5,C.surf,C.m);seg(ctx,pul,arm.W,2,C.m);
     figure(ctx,{...b,leg,arm});
     padSeg(ctx,[leg.K[0]-20,leg.K[1]-14],[leg.K[0]+2,leg.K[1]-14],8);seg(ctx,[leg.K[0]+2,leg.K[1]-14],[leg.K[0]+22,leg.K[1]+4],3,C.m);seg(ctx,[leg.K[0]+22,leg.K[1]+4],[leg.K[0]+22,FLOOR],3,C.m);
     seg(ctx,add(arm.W,-17,0),add(arm.W,17,0),5,C.acc);

   }},
 5:{label:ph=>["İleri it · nefes ver","Dirsekler kilitlenmesin","Yavaşça geri gel · nefes al","Tutacaklar göğüs hizasında"][ph],
   draw(ctx,sec){
     const {p,ph}=strength(sec);const Hp=[100,152],b=trunk(Hp,-93);
     stack(ctx,14,p,30);
     const leg=legFK(Hp,-4,92);
     const Wt=lerpP([b.S[0]+18,b.S[1]+10],[b.S[0]+64,b.S[1]+10],p);
     const arm=armIK(b.S,Wt,1);
     seatPost(ctx,Hp,b.ta,{len:62});
     const pv=[b.S[0]+70,24];seg(ctx,[pv[0],24],[pv[0]+8,FLOOR],4,C.m);
     seg(ctx,pv,arm.W,5,C.m);dot(ctx,pv,5,C.surf,C.m);
     figure(ctx,{...b,leg,arm});
     seg(ctx,add(arm.W,0,-8),add(arm.W,0,8),6,C.acc);
     return ph;
   }},
 6:{label:ph=>["Yukarı it · nefes ver","Kollar düz, kilitleme","Omuz hizasına indir · nefes al","Bel pede yaslı"][ph],
   draw(ctx,sec){
     const {p,ph}=strength(sec);const Hp=[124,152],b=trunk(Hp,-93);
     stack(ctx,14,p,12);
     const leg=legFK(Hp,-4,92);
     const Wt=lerpP([b.S[0]+10,b.S[1]-6],[b.S[0]+8,b.S[1]-63],p);
     const arm=armIK(b.S,Wt,1);
     seatPost(ctx,Hp,b.ta,{len:64});
     const pv=[Hp[0]-44,24];seg(ctx,[pv[0],24],[pv[0],FLOOR],4,C.m);
     seg(ctx,pv,arm.W,5,C.m);dot(ctx,pv,5,C.surf,C.m);
     figure(ctx,{...b,leg,arm});
     seg(ctx,add(arm.W,0,-8),add(arm.W,0,8),6,C.acc);
     return ph;
   }},
 7:{label:ph=>["Ön kolu bük · nefes ver","Üstte 1 sn sık","Yavaşça aç · nefes al","Kol arkası pede yaslı"][ph],
   draw(ctx,sec){
     const {p,ph}=strength(sec);const Hp=[100,152],b=trunk(Hp,-84);
     stack(ctx,14,p,30);
     const leg=legFK(Hp,-4,92);
     const E=at(b.S,40,L.uarm),W2=at(E,lerp(8,-118,p),L.farm);
     const arm={E,W:W2};
     seatPost(ctx,Hp,b.ta,{back:false,seatL:-22,seatR:24});
     const o=at([0,0],130,9);
     padSeg(ctx,add(at(b.S,40,6),o[0],o[1]),add(at(b.S,40,L.uarm+8),o[0],o[1]),10);
     const base=add(at(b.S,40,L.uarm-6),o[0],o[1]+8);seg(ctx,base,[base[0]+6,FLOOR],4,C.m);seg(ctx,[base[0]-14,FLOOR],[base[0]+26,FLOOR],5,C.m);
     seg(ctx,[31,38],[E[0],38],2,C.m);seg(ctx,[E[0],38],E,2,C.m);
     seg(ctx,E,W2,4,C.m);
     figure(ctx,{...b,leg,arm});
     dot(ctx,E,5,C.surf,C.acc);dot(ctx,W2,6,C.acc,C.m);
     return ph;
   }},
 8:{label:ph=>["Aşağı it · nefes ver","Kollar tam açık","Yavaşça yukarı · nefes al","Dirsekler gövde yanında"][ph],
   draw(ctx,sec){
     const {p,ph}=strength(sec);const Hp=[118,110],b=trunk(Hp,-88);
     const leg=legIK(Hp,[Hp[0]+4,FLOOR-6],-1);
     const E=at(b.S,96,L.uarm),Wp=at(E,lerp(-12,86,p),L.farm);
     const arm={E,W:Wp};
     const pul=[E[0]+46,14];
     seg(ctx,[pul[0]+14,6],[pul[0]+14,FLOOR],5,C.m);seg(ctx,[pul[0],8],[pul[0]+14,8],4,C.m);
     dot(ctx,pul,5,C.surf,C.m);seg(ctx,pul,Wp,2,C.m);
     stack(ctx,pul[0]+30,p,10);
     figure(ctx,{...b,leg,arm});
     const ca=ang(pul,Wp)+90;seg(ctx,at(Wp,ca,12),at(Wp,ca+180,12),5,C.acc);
     return ph;
   }},
 9:{label:ph=>["Karından bük · nefes ver","Altta 1 sn sık","Yavaşça doğrul · nefes al","Sırt dik başla"][ph],
   draw(ctx,sec){
     const {p,ph}=strength(sec);const Hp=[110,152],b=trunk(Hp,lerp(-94,-52,p));
     stack(ctx,14,p,30);
     const leg=legFK(Hp,-4,94);
     const Wt=at(b.S,b.ta+70,20);
     const arm=armIK(b.S,Wt,1);
     seatPost(ctx,Hp,b.ta,{back:false,seatL:-22,seatR:26});
     const pv=[Hp[0]+4,Hp[1]-30];
     figure(ctx,{...b,leg,arm});
     seg(ctx,pv,arm.W,5,C.m);dot(ctx,pv,5,C.surf,C.acc);
     const o=at([0,0],b.ta+90,10);padSeg(ctx,add(at(Hp,b.ta,40),o[0],o[1]),add(at(Hp,b.ta,66),o[0],o[1]),8);
     dot(ctx,arm.W,6,C.acc,C.m);
     dot(ctx,add(leg.A,9,-4),6,C.pad,C.m);
     return ph;
   }},
 10:{cardio:true,label:()=>"Sabit tempo · nefes düzenli",
   draw(ctx,sec){
     const th=sec/1.4*360;const Hp=[112,112],b=trunk(Hp,-64);
     const c=[136,176],r=15;
     const ped=t=>at(c,t,r);
     const bar=[Hp[0]+62,Hp[1]-24];
     // gövde: sele direği, gidon, volan
     seg(ctx,[Hp[0]-2,Hp[1]+8],c,6,C.m);seg(ctx,c,[200,FLOOR-24],6,C.m);seg(ctx,[200,FLOOR-24],[bar[0]+6,bar[1]+6],6,C.m);
     dot(ctx,[206,168],24,null,C.m);seg(ctx,[100,FLOOR-2],[230,FLOOR-2],6,C.m);
     box(ctx,Hp[0]-18,Hp[1]+4,36,8,C.pad,C.m,4);
     ctx.globalAlpha=.32;seg(ctx,c,ped(th+180),4,C.m);ctx.globalAlpha=1;
     const legN=legIK(Hp,ped(th),-1),legF=legIK(Hp,ped(th+180),-1);
     const arm=armIK(b.S,bar,1);
     dot(ctx,c,7,C.surf,C.m);
     figure(ctx,{...b,leg:legN,arm,far:{leg:legF}});
     seg(ctx,c,ped(th),4,C.m);box(ctx,ped(th)[0]-8,ped(th)[1]-2,16,5,C.acc,C.m,2);
     dot(ctx,bar,5,C.acc,C.m);
     return 0;
   }}
};

function draw(canvas,id,sec){
  const ex=EXS[id];if(!ex)return;
  const dpr=Math.min(window.devicePixelRatio||1,3);
  const cw=Math.round(canvas.clientWidth*dpr)||W*dpr,ch=Math.round(cw*H/W);
  if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch}
  const ctx=canvas.getContext("2d");
  ctx.setTransform(cw/W,0,0,cw/W,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(0,OFF);
  floor(ctx);
  const ph=ex.draw(ctx,sec);
  ctx.restore();
  const txt=ex.label(ph);
  ctx.font=`600 13px ${C.font}`;
  const tw=ctx.measureText(txt).width;
  box(ctx,W-tw-22,8,tw+14,22,C.surf,C.line,11);
  ctx.fillStyle=C.ink;ctx.textBaseline="middle";ctx.fillText(txt,W-tw-15,19.5);
}
return{draw,readColors,W,H};
})();

</script>
<script>
const EX=[
 {id:1,tr:"Eliptik",en:"Elliptical Cross Trainer",sets:1,reps:15,cardio:true},
 {id:2,tr:"Bacak Ön (Leg Extension)",en:"Leg extension machine",sets:2,reps:15},
 {id:3,tr:"Bacak Arka (Leg Curl)",en:"Seated leg curl machine",sets:2,reps:15},
 {id:4,tr:"Sırt Çekiş (Lat Pulldown)",en:"Lat pulldown machine",sets:2,reps:15},
 {id:5,tr:"Göğüs Press",en:"Chest press machine",sets:2,reps:15},
 {id:6,tr:"Omuz Press",en:"Shoulder press machine",sets:2,reps:15},
 {id:7,tr:"Biceps Curl",en:"Biceps curl machine",sets:2,reps:15},
 {id:8,tr:"Triceps Pushdown",en:"Triceps pushdown",sets:2,reps:15},
 {id:9,tr:"Karın Makinesi",en:"Abdominal machine",sets:2,reps:20},
 {id:10,tr:"Kondisyon Bisikleti",en:"Cycling",sets:1,reps:15,cardio:true}
];
const TIPS={
 1:["Dik dur, karnını hafif sık.","Topuklar pedaldan kalkmasın.","Kollar ve bacaklar birlikte çalışsın."],
 2:["Dizin, makinenin dönme noktası (sarı halka) ile aynı hizada olsun.","Ped ayak bileğinin hemen üstünde dursun.","Üstte 1 sn sık, dizini kilitlemeden yavaşça indir."],
 3:["Dizin makinenin dönme noktası ile hizalı olsun.","Uyluk pedi bacaklarını sabit tutsun.","Topukları alta çek, ağırlık yığına çarpmadan geri bırak."],
 4:["Diz pedini uyluklarına oturt.","Barı enseye değil, göğsün üst kısmına çek.","Dirsekleri aşağı-arkaya götür, kürek kemiklerini sık."],
 5:["Koltuğu tutacaklar göğüs ortası hizasında olacak şekilde ayarla.","Sırtın pede yaslı kalsın.","Dirsekleri sonuna kadar kilitleme."],
 6:["Tutacaklar omuz hizasında başlasın.","Belini pedden ayırma.","Yukarı it, dirsekleri kilitlemeden yavaşça indir."],
 7:["Kolunun arkası pede tam yaslı olsun.","Dirseğin makinenin dönme noktası ile hizalı olsun.","Sadece ön kol hareket etsin, gövdeyle sallanma."],
 8:["Dirsekler gövdenin yanında sabit kalsın.","Kolları tam aç, yavaşça yukarı gel.","Öne eğilme, omuzlarını kaldırma."],
 9:["Hareketi kollarla çekerek değil, karnını bükerek yap.","Bükerken nefes ver.","Ayaklar alttaki pedlerin arkasında sabit."],
 10:["Sele yüksekliği: pedal en alttayken dizin hafif bükük kalsın.","Sırtın dik, omuzların gevşek olsun.","Sabit bir tempoda çevir."]
};
const PROGRAM_END="2026-10-31";
const $=id=>document.getElementById(id);
const LS="antrenman-defteri-v1";
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const TODAY=iso(new Date());
const fmtLong=s=>fromIso(s).toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"long"});
const fmtShort=s=>fromIso(s).toLocaleDateString("tr-TR",{day:"numeric",month:"short"});
const n1=v=>(Math.round(v*10)/10).toLocaleString("tr-TR");

let showHow=true;try{showHow=localStorage.getItem("antrenman-defteri-how")!=="0"}catch(e){}
let sessions={};          // date -> {date, sets:[{ex,kg,reps,t}]}
let cur=TODAY, open=null, tab="log", pickEx=4, coll=null;
const draft={};           // exId -> {kg,reps}

function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LS)||"{}");if(v&&typeof v==="object")sessions=v}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(sessions))}catch(e){}}

let chain=Promise.resolve();
function persist(date){
  saveLocal();
  if(!coll) return;
  const s=sessions[date];
  const body=s&&s.sets.length?JSON.parse(JSON.stringify(s)):null;
  chain=chain.then(()=>body?coll.doc(date).set(body):coll.doc(date).delete())
    .catch(e=>toast(e&&e.code==="quota_exceeded"?"Depolama doldu, eski kayıtları silmek gerekiyor.":"Kaydedilemedi. İnternet bağlantını kontrol edip tekrar dene."));
}

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}

function setsFor(date,exId){const s=sessions[date];return s?s.sets.filter(x=>x.ex===exId):[]}
function lastFor(exId,before){
  const ds=Object.keys(sessions).filter(d=>d<before).sort().reverse();
  for(const d of ds){const ss=setsFor(d,exId);if(ss.length)return{date:d,sets:ss}}
  return null;
}
function unit(ex){return ex.cardio?["dk","seviye"]:["kg","tekrar"]}
function setText(ex,s){return ex.cardio?`${n1(s.kg)} dk`:`${n1(s.kg)} kg`}
function setSub(ex,s){return ex.cardio?`sv ${s.reps}`:`× ${s.reps}`}

function renderLog(){
  $("dlabel").textContent=cur===TODAY?"Bugün":fmtShort(cur);
  $("dsub").textContent=fmtLong(cur);
  $("next").disabled=cur>=TODAY;
  let done=0;
  const html=EX.map(ex=>{
    const ss=setsFor(cur,ex.id);
    const isDone=ss.length>=ex.sets; if(isDone)done++;
    const last=lastFor(ex.id,cur);
    const [u1,u2]=unit(ex);
    const lastTxt=last?`Son (${fmtShort(last.date)}): <b class="num">${last.sets.map(s=>ex.cardio?`${n1(s.kg)} dk`:`${n1(s.kg)}×${s.reps}`).join(", ")}</b>`:"Henüz kayıt yok";
    const isOpen=open===ex.id;
    let body="";
    if(isOpen){
      if(!draft[ex.id]){
        const ref=ss[ss.length-1]||(last&&last.sets[last.sets.length-1]);
        draft[ex.id]=ref?{kg:ref.kg,reps:ref.reps}:{kg:ex.cardio?10:20,reps:ex.cardio?5:ex.reps};
      }
      const d=draft[ex.id];
      body=`<div class="body">
        ${showHow?`<div class="howto"><canvas id="anim" role="img" aria-label="${ex.tr} doğru hareket animasyonu"></canvas>
          <div class="cap"><span id="animcap">Dokun: durdur</span><button class="linkbtn" data-how="0">Animasyonu gizle</button></div>
          <ul>${TIPS[ex.id].map(t=>`<li>${t}</li>`).join("")}</ul></div>`:`<button class="linkbtn" data-how="1" style="align-self:flex-start">Nasıl yapılır? Animasyonu göster</button>`}
        <div class="sets">${ss.length?ss.map((s,i)=>`<span class="chip num">${i+1}. set · ${setText(ex,s)} <em>${setSub(ex,s)}</em><button data-del="${ex.id}:${s.t}" aria-label="${i+1}. seti sil">✕</button></span>`).join(""):`<span class="empty">Bu gün için set girilmedi.</span>`}</div>
        <div class="inputs">
          <div class="field"><label for="a${ex.id}">${ex.cardio?"Süre (dk)":"Ağırlık (kg)"}</label>
            <div class="stepper"><button data-step="${ex.id}:kg:-${ex.cardio?1:2.5}" aria-label="Azalt">−</button><input id="a${ex.id}" class="num" type="number" inputmode="decimal" step="0.5" min="0" value="${d.kg}" data-in="${ex.id}:kg"><button data-step="${ex.id}:kg:${ex.cardio?1:2.5}" aria-label="Artır">+</button></div></div>
          <div class="field"><label for="b${ex.id}">${ex.cardio?"Seviye":"Tekrar"}</label>
            <div class="stepper"><button data-step="${ex.id}:reps:-1" aria-label="Azalt">−</button><input id="b${ex.id}" class="num" type="number" inputmode="numeric" step="1" min="0" value="${d.reps}" data-in="${ex.id}:reps"><button data-step="${ex.id}:reps:1" aria-label="Artır">+</button></div></div>
        </div>
        <button class="add" data-add="${ex.id}">${ss.length+1}. SETİ KAYDET</button>
        <div class="hint">Program: ${ex.sets} set × ${ex.reps}${ex.cardio?" (kardiyo)":" tekrar"} · dinlenme ${ex.id===9?"belirtilmemiş":"60 sn"}</div>
      </div>`;
    }
    return `<article class="ex${isDone?" done":""}">
      <button class="exhead" data-open="${ex.id}" aria-expanded="${isOpen}">
        <span class="badge">${ex.id}</span>
        <span class="exname"><h3>${ex.tr}</h3><span class="en">${ex.en}</span><div class="last">${lastTxt}</div></span>
        <span class="target num">${ss.length}/${ex.sets}<small>set</small></span>
      </button>${body}</article>`;
  }).join("");
  $("exlist").innerHTML=html;
  $("pbar").style.width=(done/EX.length*100)+"%";
  $("ptext").textContent=`${done}/${EX.length} egzersiz`;
}

function renderHist(){
  $("pick").innerHTML=EX.map(ex=>`<button aria-pressed="${pickEx===ex.id}" data-pick="${ex.id}">${ex.id}. ${ex.tr.replace(/ \(.*\)/,"")}</button>`).join("");
  const ex=EX.find(e=>e.id===pickEx);
  const pts=Object.keys(sessions).sort().map(d=>{const ss=setsFor(d,ex.id);return ss.length?{d,v:Math.max(...ss.map(s=>s.kg)),vol:ss.reduce((a,s)=>a+s.kg*s.reps,0)}:null}).filter(Boolean);
  const unitName=ex.cardio?"dk":"kg";
  if(!pts.length){$("chartbox").innerHTML=`<p class="empty">${ex.tr} için henüz kayıt yok. İlk seti girdiğinde gelişim grafiği burada çıkar.</p>`;$("stats").innerHTML="";}
  else{
    const W=340,H=150,L=34,R=12,T=14,B=26;
    const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);
    if(lo===hi){lo=Math.max(0,lo-5);hi=hi+5}
    const step=(hi-lo)/2;
    const x=i=>pts.length===1?(L+W-R)/2:L+i*(W-L-R)/(pts.length-1);
    const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
    const ticks=[lo,lo+step,hi];
    const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
    const area=`${line} L${x(pts.length-1).toFixed(1)},${H-B} L${x(0).toFixed(1)},${H-B} Z`;
    const lab=[0,pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
    $("chartbox").innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${ex.tr} en yüksek ${unitName} gelişimi">
      ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${n1(t)}</text>`).join("")}
      <path d="${area}" fill="var(--navy)" fill-opacity=".12"/>
      <path d="${line}" fill="none" stroke="var(--navy)" stroke-width="2.5" stroke-linejoin="round"/>
      ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?"var(--chalk)":"var(--navy)"}" stroke="var(--surface)" stroke-width="1.5"/>`).join("")}
      ${lab.map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="${pts.length===1?"middle":i===0?"start":"end"}" font-size="11" fill="var(--muted)">${fmtShort(pts[i].d)}</text>`).join("")}
    </svg>`;
    const first=pts[0].v,lastV=pts[pts.length-1].v,diff=lastV-first;
    $("stats").innerHTML=`<div class="stat"><div class="v num">${n1(lastV)}</div><div class="k">Son (${unitName})</div></div>
      <div class="stat"><div class="v num">${n1(Math.max(...vs))}</div><div class="k">En yüksek</div></div>
      <div class="stat"><div class="v num" style="color:${diff>0?"var(--good)":"var(--ink)"}">${diff>0?"+":""}${n1(diff)}</div><div class="k">Başlangıçtan</div></div>`;
  }
  const ds=Object.keys(sessions).filter(d=>sessions[d].sets.length).sort().reverse();
  $("hist").innerHTML=ds.length?ds.map(d=>{
    const ss=sessions[d].sets;
    const exCount=new Set(ss.map(s=>s.ex)).size;
    const vol=ss.filter(s=>!EX.find(e=>e.id===s.ex).cardio).reduce((a,s)=>a+s.kg*s.reps,0);
    return `<div class="hrow"><button data-go="${d}"><div class="t">${fmtLong(d)}</div><div class="s num">${exCount} egzersiz · ${ss.length} set</div></button><div class="r num">${Math.round(vol).toLocaleString("tr-TR")} kg<div class="s" style="font-family:var(--body);font-weight:400">toplam hacim</div></div></div>`;
  }).join(""):`<p class="empty">Kaydedilmiş antrenman yok. "Antrenman" sekmesinde bir egzersize dokunup ilk setini gir.</p>`;
}

function render(){
  const left=Math.ceil((fromIso(PROGRAM_END)-fromIso(TODAY))/864e5);
  $("left").textContent=left>=0?`31 Ekim (${left} gün)`:"31 Ekim (bitti)";
  $("view-log").hidden=tab!=="log";$("view-hist").hidden=tab!=="hist";
  $("tab-log").setAttribute("aria-selected",tab==="log");$("tab-hist").setAttribute("aria-selected",tab==="hist");
  tab==="log"?renderLog():renderHist();
  startAnim();
}

/* ---- animasyon döngüsü ---- */
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
let raf=0,animT0=performance.now(),paused=REDUCED,pausedAt=1.7,lastColors=0;
function startAnim(){if(!raf)raf=requestAnimationFrame(tick)}
function tick(now){
  const cv=document.getElementById("anim");
  if(!cv||!open){raf=0;return}
  if(now-lastColors>1000){ANIM.readColors();lastColors=now}
  ANIM.draw(cv,open,paused?pausedAt:(now-animT0)/1000);
  raf=requestAnimationFrame(tick);
}
function toggleAnim(){
  const now=performance.now();
  if(paused){animT0=now-pausedAt*1000;paused=false}else{pausedAt=(now-animT0)/1000;paused=true}
  const c=document.getElementById("animcap");if(c)c.textContent=paused?"Dokun: oynat":"Dokun: durdur";
}
document.addEventListener("click",e=>{if(e.target.id==="anim")toggleAnim()});

/* ---- yedek ---- */
function exportBackup(){
  const txt=JSON.stringify({app:"antrenman-defteri",v:1,exported:new Date().toISOString(),sessions});
  if(window.Android&&window.Android.share){window.Android.share(txt);return}
  const ta=$("bk-text");
  const fallback=()=>{ta.value=txt;ta.focus();ta.select();toast("Yedek kutuya yazıldı, kopyalayıp sakla.")};
  try{navigator.clipboard.writeText(txt).then(()=>toast("Yedek panoya kopyalandı."),fallback)}catch(e){fallback()}
}
function importBackup(){
  let data;try{data=JSON.parse($("bk-text").value)}catch(e){toast("Metin okunamadı. Yedeğin tamamını yapıştırdığından emin ol.");return}
  if(!data||data.app!=="antrenman-defteri"||typeof data.sessions!=="object"){toast("Bu metin bir Antrenman Defteri yedeği değil.");return}
  let added=0;
  for(const [d,s] of Object.entries(data.sessions)){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!s||!Array.isArray(s.sets))continue;
    const have=sessions[d]?sessions[d].sets:[];const seen=new Set(have.map(x=>x.t));
    const extra=s.sets.filter(x=>x&&typeof x.ex==="number"&&typeof x.kg==="number"&&typeof x.reps==="number"&&!seen.has(x.t));
    if(extra.length){sessions[d]={date:d,sets:have.concat(extra).sort((a,b)=>a.t-b.t)};added+=extra.length;persist(d)}
  }
  $("bk-text").value="";render();toast(added?`${added} set geri yüklendi.`:"Yeni kayıt bulunamadı, hepsi zaten var.");
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const ds=b.dataset;
  if(b.id==="prev"){const d=fromIso(cur);d.setDate(d.getDate()-1);cur=iso(d);open=null;render()}
  else if(b.id==="next"){const d=fromIso(cur);d.setDate(d.getDate()+1);if(iso(d)<=TODAY){cur=iso(d);open=null;render()}}
  else if(b.id==="tab-log"){tab="log";render()}
  else if(b.id==="tab-hist"){tab="hist";render()}
  else if(ds.open){const id=+ds.open;open=open===id?null:id;delete draft[id];render()}
  else if(ds.step){const [id,f,dv]=ds.step.split(":");const d=draft[id];d[f]=Math.max(0,Math.round((Number(d[f])+Number(dv))*10)/10);const inp=$((f==="kg"?"a":"b")+id);if(inp)inp.value=d[f]}
  else if(ds.add){
    const id=+ds.add,d=draft[id];const kg=Number(d.kg),reps=Number(d.reps);
    if(!(kg>=0)||!(reps>0)){toast("Geçerli bir değer gir.");return}
    if(!sessions[cur])sessions[cur]={date:cur,sets:[]};
    sessions[cur].sets.push({ex:id,kg,reps,t:Date.now()});
    persist(cur);
    const ex=EX.find(x=>x.id===id);
    if(setsFor(cur,id).length>=ex.sets){const nx=EX.find(x=>x.id>id&&setsFor(cur,x.id).length<x.sets);open=nx?nx.id:null}
    render();toast("Set kaydedildi");
  }
  else if(ds.del){const [id,t]=ds.del.split(":").map(Number);const s=sessions[cur];if(!s)return;s.sets=s.sets.filter(x=>!(x.ex===id&&x.t===t));if(!s.sets.length)delete sessions[cur];persist(cur);render()}
  else if(ds.pick){pickEx=+ds.pick;render()}
  else if(ds.how){showHow=ds.how==="1";try{localStorage.setItem("antrenman-defteri-how",showHow?"1":"0")}catch(e){}render()}
  else if(b.id==="bk-export")exportBackup();
  else if(b.id==="bk-import")importBackup();
  else if(ds.go){cur=ds.go;tab="log";open=null;render();window.scrollTo(0,0)}
});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k)return;const [id,f]=k.split(":");if(draft[id])draft[id][f]=e.target.value});

loadLocal();render();
(async()=>{
  const db=window.claude&&window.claude.use?await window.claude.use("db"):null;
  if(!db){$("status").textContent="Kayıtlar bu telefonda saklanıyor.";return}
  coll=db.collection("workouts");
  coll.onSnapshot(snap=>{
    const next={};snap.docs.forEach(doc=>{const v=doc.data();if(v&&Array.isArray(v.sets))next[doc.id]={date:doc.id,sets:v.sets.map(s=>({...s}))}});
    if(!coll.synced){coll.synced=true;const local=sessions;sessions=next;Object.keys(local).forEach(d=>{if(!next[d]&&local[d].sets&&local[d].sets.length){sessions[d]=local[d];persist(d)}})}else sessions=next;
    saveLocal();$("status").textContent="Kayıtlar hesabına kaydediliyor.";
    const a=document.activeElement;if(!(a&&a.dataset&&a.dataset.in))render();
  },()=>{$("status").textContent="Bağlantı kesildi; yeni setler bu telefonda tutuluyor.";coll=null});
})();
</script>
