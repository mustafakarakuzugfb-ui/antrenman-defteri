plugins { id 'com.android.application' }
android {
    namespace 'com.mustafa.antrenman'
    compileSdk 34
    defaultConfig {
        applicationId 'com.mustafa.antrenman'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    // Her derlemede aynı imza: telefondaki uygulama silinmeden güncellenebilsin
    signingConfigs {
        sabit {
            storeFile file('imza.jks')
            storePassword 'antrenman-defteri-imza'
            keyAlias 'antrenman'
            keyPassword 'antrenman-defteri-imza'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.sabit }
        release { minifyEnabled false; signingConfig signingConfigs.sabit }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
