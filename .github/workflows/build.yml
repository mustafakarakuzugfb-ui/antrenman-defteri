name: APK derle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK derle
        run: gradle :app:assembleDebug
      - name: Dosyayı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk AntrenmanDefteri.apk
      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Antrenman Defteri v${{ github.run_number }}
          body: Telefonundan bu sayfayı açıp AntrenmanDefteri.apk dosyasına dokunarak indir.
          files: AntrenmanDefteri.apk
